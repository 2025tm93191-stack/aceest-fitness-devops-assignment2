name: CI Pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check (syntax errors)
        run: python -m compileall -q app.py ACEest_Fitness.py fitness tests

      - name: Lint with flake8
        run: flake8 .

      - name: Lint deployment scripts with shellcheck
        run: shellcheck -x k8s/scripts/*.sh

  docker-build-and-test:
    name: Docker Image Assembly & Automated Testing
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: docker build --target runtime --build-arg APP_VERSION="$(cat VERSION)" -t aceest-fitness:${{ github.sha }} .

      - name: Smoke test the runtime container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/version; then echo; echo "Container is healthy"; exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs aceest; exit 1

      - name: Show image size
        if: always()
        run: docker images aceest-fitness

  publish-image:
    name: Publish image to Docker Hub (tags only)
    runs-on: ubuntu-latest
    needs: docker-build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Check Docker Hub secrets
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets are not set; image not published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image metadata (version from the git tag)
        if: steps.creds.outputs.ok == 'true'
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aceest-fitness:latest
