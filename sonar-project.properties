# SonarQube / SonarCloud analysis settings for ACEest Fitness & Gym.
# Jenkins passes sonar.host.url, sonar.token and sonar.projectVersion; run locally with:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=<token>
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym
sonar.sourceEncoding=UTF-8

sonar.sources=app.py,ACEest_Fitness.py,fitness,templates
sonar.tests=tests
sonar.exclusions=legacy_versions/**,k8s/**,Screenshots/**,reports/**
sonar.python.version=3.12

# Produced by: pytest --junitxml=reports/junit.xml --cov=fitness --cov=app --cov-report=xml:reports/coverage.xml
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
