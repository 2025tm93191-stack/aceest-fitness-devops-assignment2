# Preview service: always points at the green pods (smoke tests before the switch).
apiVersion: v1
kind: Service
metadata:
  name: aceest-green
  namespace: aceest-blue-green
  labels:
    app: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest
    track: green
  ports:
    - name: http
      port: 80
      targetPort: http
