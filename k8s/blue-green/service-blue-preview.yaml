# Preview service: always points at the blue pods (smoke tests before the switch).
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue
  namespace: aceest-blue-green
  labels:
    app: aceest
spec:
  type: ClusterIP
  selector:
    app: aceest
    track: blue
  ports:
    - name: http
      port: 80
      targetPort: http
