apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary
  namespace: aceest-canary
  annotations:
    # /canary/version -> /version inside the app
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Canary release: send __CANARY_WEIGHT__% of requests to the new version.
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "__CANARY_WEIGHT__"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /canary(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: aceest-canary
                port:
                  number: 80
